name: Weekly Evaluation Run

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create .env from secrets
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
          echo "OPENAI_MODEL=gpt-4o" >> .env
          echo "SQLITE_DB_PATH=/data/ethicsguard.db" >> .env
          echo "LOG_LEVEL=info" >> .env
          echo "RATE_LIMIT_PER_MINUTE=60" >> .env
          echo "API_KEY_SECRET=${{ secrets.API_KEY_SECRET }}" >> .env

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "(healthy)"; then
              echo "Services are healthy."
              break
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

      - name: Run evaluation
        run: make eval

      - name: Download report
        run: |
          mkdir -p evaluation/results
          make report

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.run_number }}
          path: evaluation/results/comparison_report.pdf
          retention-days: 90

      - name: Tear down services
        if: always()
        run: docker compose down -v
