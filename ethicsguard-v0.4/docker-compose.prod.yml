version: "3.9"

# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  guardrail-service:
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    environment:
      - LOG_LEVEL=warning
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redteam-service:
    ports: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      - LOG_LEVEL=warning
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  evaluation-service:
    ports: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      - LOG_LEVEL=warning
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  dashboard-service:
    ports:
      - "8501:8501"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      - LOG_LEVEL=warning
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
