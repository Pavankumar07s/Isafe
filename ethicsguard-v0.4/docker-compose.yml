version: "3.9"

services:
  guardrail-service:
    build:
      context: .
      dockerfile: services/guardrail-service/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - sqlite-data:/data
      - audit-logs:/app/logs
    networks:
      - ethicsguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  redteam-service:
    build:
      context: .
      dockerfile: services/redteam-service/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      guardrail-service:
        condition: service_healthy
    volumes:
      - sqlite-data:/data
      - eval-results:/app/results
    networks:
      - ethicsguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation-service/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      guardrail-service:
        condition: service_healthy
    volumes:
      - sqlite-data:/data
      - eval-results:/app/results
    networks:
      - ethicsguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard-service/Dockerfile
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      guardrail-service:
        condition: service_healthy
    volumes:
      - sqlite-data:/data
    networks:
      - ethicsguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sqlite-data:
  eval-results:
  audit-logs:

networks:
  ethicsguard-net:
    driver: bridge
